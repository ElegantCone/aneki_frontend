name: Integrated CI/CD

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  trigger-backend-pipeline:
    name: Trigger backend orchestrator
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch integrated pipeline
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BACKEND_REPOSITORY_DISPATCH_TOKEN }}
          repository: ElegantCone/aneki
          event-type: frontend-updated
          client-payload: |
            {
              "frontend_ref": "${{ github.ref_name }}",
              "frontend_sha": "${{ github.sha }}",
              "frontend_repository": "${{ github.repository }}"
            }
